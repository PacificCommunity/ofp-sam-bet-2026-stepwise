name: ofp-sam-bet-2026-stepwise-report
description: Build the reproducible 23-configuration BET 2026 pathway report from repository payloads, ending at the current Diagnostic model.
branch: main
target_folder: model-development-report
command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360
remote_host: kflow-local-kyuhank-nc240124
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput

checkout:
  mode: sparse
  paths:
    - R
    - job-config.R
    - data/stepwise/source-index.csv
    - data/stepwise/hessian-audit.csv
    - data/stepwise/models
    - data/stepwise/report-cache
    - model-development-report

resources:
  cpus: 2
  memory: 8GB
  disk: 10GB

env:
  REPORT_OUTPUT_DIR: model-development
  STEPWISE_MODEL_JOBS: ""
  STEPWISE_VIEWER_JOB: ""
  STEPWISE_SOURCE_INDEX_JSON: ""
  FLOW_SPECIES: BET
  FLOW_SPECIES_LABEL: bigeye tuna
  FLOW_ASSESSMENT_YEAR: "2026"
  KFLOW_RUNTIME_REQUIRE_PRIVATE_PACKAGES: "false"
  KFLOW_RUNTIME_UPDATE: "off"

output_patterns:
  - model-development/**

triggers: {}

job_config:
  optional:
    - STEPWISE_MODEL_JOBS
    - STEPWISE_VIEWER_JOB
    - STEPWISE_SOURCE_INDEX_JSON
    - FLOW_SPECIES
    - FLOW_SPECIES_LABEL
    - FLOW_ASSESSMENT_YEAR
