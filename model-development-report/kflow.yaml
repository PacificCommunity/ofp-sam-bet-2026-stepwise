name: ofp-sam-bet-2026-stepwise-report
description: Build the dynamic 22-step BET 2026 pathway report, including historical Job 19835 as Step 19b and the tau=2, F33-penalty and h=0.90 transitions to the current Diagnostic model.
branch: main
target_folder: model-development-report
command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360
remote_host: suva

resources:
  cpus: 4
  memory: 16GB
  disk: 30GB

env:
  REPORT_OUTPUT_DIR: model-development
  STEPWISE_MODEL_JOBS: ""
  STEPWISE_VIEWER_JOB: ""
  STEPWISE_SOURCE_INDEX_JSON: ""
  FLOW_SPECIES: BET
  FLOW_SPECIES_LABEL: bigeye tuna
  FLOW_ASSESSMENT_YEAR: "2026"
  MFCLSHINY_GITHUB_REF: 1fc0bb6bf4cf5349da6f6def54cc56c5a60e182a
  KFLOW_RUNTIME_REQUIRE_PRIVATE_PACKAGES: "true"
  KFLOW_RUNTIME_UPDATE: auto
  KFLOW_RUNTIME_GITHUB_AUTH: "true"
  KFLOW_FORWARD_GITHUB_TOKEN_TO_RUNTIME: "true"

output_patterns:
  - model-development/**

triggers: {}

job_config:
  optional:
    - STEPWISE_MODEL_JOBS
    - STEPWISE_VIEWER_JOB
    - STEPWISE_SOURCE_INDEX_JSON
    - FLOW_SPECIES
    - FLOW_SPECIES_LABEL
    - FLOW_ASSESSMENT_YEAR
    - MFCLSHINY_GITHUB_REF
