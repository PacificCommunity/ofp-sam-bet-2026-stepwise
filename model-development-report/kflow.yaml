name: ofp-sam-bet-2026-stepwise-report
description: Build a portable, report-ready account of the BET 2026 stepwise model-development pathway and, when supplied, fitted-model results.
branch: main
target_folder: model-development-report
command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360
remote_host: noumea

resources:
  cpus: 1
  memory: 4GB
  disk: 10GB

env:
  REPORT_OUTPUT_DIR: model-development
  STEPWISE_MODEL_JOBS: ""
  FLOW_SPECIES: BET
  FLOW_SPECIES_LABEL: bigeye tuna
  FLOW_ASSESSMENT_YEAR: "2026"
  MFCLSHINY_GITHUB_REF: dc17e84eb08c9e5d5b2b9022d954f108c0640ab0
  KFLOW_RUNTIME_REQUIRE_PRIVATE_PACKAGES: "true"
  KFLOW_RUNTIME_UPDATE: auto
  KFLOW_RUNTIME_GITHUB_AUTH: "true"
  KFLOW_FORWARD_GITHUB_TOKEN_TO_RUNTIME: "true"

output_patterns:
  - model-development/**

triggers: {}

job_config:
  optional:
    - STEPWISE_MODEL_JOBS
    - FLOW_SPECIES
    - FLOW_SPECIES_LABEL
    - FLOW_ASSESSMENT_YEAR
    - MFCLSHINY_GITHUB_REF
