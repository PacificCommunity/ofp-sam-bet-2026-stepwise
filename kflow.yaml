name: bet-2026-final-exploration-v25
description: "BET 2026 tuna-flow v2.5 exploration with Job 18518-style fixed DM concentration; select mixing K and whether tag tau is estimated."

repo_full_name: PacificCommunity/ofp-sam-bet-2026-stepwise
branch: final-exploration
remote_host: suva
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput
slot_requirements: 'regexp("^suvofp", Machine)'

command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360

resources:
  cpus: 2
  memory: 8GB
  disk: 8GB

exclude_machines: []
exclude_slots: []

env:
  MODEL: K015-tau-estimated
  PROGRAM_PATH: /home/mfcl/mfclo64
  BET_PHASE10_11_CONVERGENCE: "-4"
  REGIONAL_RECRUITMENT_PENALTY: "0.1"
  TAG_TAU_GROUPING: common
  TAG_TAU_LOWER_BOUND: default
  ESTIMATE_M_FINAL: "false"
  TAG_LIKELIHOOD_WEIGHT: "0"
  BUILD_MODEL_PAYLOAD: "true"
  KFLOW_RUNTIME_REQUIRE_PRIVATE_PACKAGES: "true"
  KFLOW_RUNTIME_UPDATE: never
  TUNA_FLOW_RUNTIME_UPDATE: never
  KFLOW_REPO_RUNTIME_UPDATE: always
  KFLOW_RUNTIME_PACKAGES: none
  KFLOW_REPO_RUNTIME_PACKAGES: mfclkit=PacificCommunity/ofp-sam-mfclkit@25103916446d0395286afae28b5404bf361670fc,mfclshiny=PacificCommunity/mfclshiny@1fc0bb6bf4cf5349da6f6def54cc56c5a60e182a
  MFCLKIT_GITHUB_REF: 25103916446d0395286afae28b5404bf361670fc
  MFCLSHINY_GITHUB_REF: 1fc0bb6bf4cf5349da6f6def54cc56c5a60e182a
  KFLOW_RUNTIME_GITHUB_AUTH: "true"
  KFLOW_FORWARD_GITHUB_TOKEN_TO_RUNTIME: "true"
  MFCLSHINY_PAYLOAD_OBJECT_CACHE: all
  MFCLSHINY_PAYLOAD_ARTIFACTS: core

tags:
  species: BET
  stage: final-exploration-v25
  comparison_jobs: "17805,18386,18518"

metadata:
  scientific_parent_job: "17805"
  verified_k015_job: "18386"
  dm_fix_reference_job: "18518"
  step20c_model_job: "15062"
  parent_source_commit: 6ebfb4a98a933b2e410a1af480532b23873fa9c3
  ini_source_repo: PacificCommunity/ofp-sam-2026-BET-YFT-build-ini
  ini_source_branch: SC22-IP10-regionMean
  ini_source_commit: efe3107c72774ee73b5e6dc45e44cf51f0fc20e8
  fixed_log_m: "-2.54930339768360e+00"
  f15_qc_mode: lt70
  dom_qc_mode: gt90_midpoint
  dm_nmax: 25
  dm_groups: 8
  dm_fish_pars_22: "fixed at 7"
  dm_fish_pars_23: "estimated"
  natural_mortality_fixed: true
  tag_likelihood: negative-binomial
  reporting_rate_controls: "numerically identical to SC22-IP10-regionMean; K015 byte-identical to Job 18386"
  regional_scaling: "Job 17805 active 20x5 matrix with v2.6 header removed for v2.5"
  container: "tuna-flow v2.5 pinned by digest"
  runtime_mfclkit_default: 25103916446d0395286afae28b5404bf361670fc
  runtime_mfclshiny_default: 1fc0bb6bf4cf5349da6f6def54cc56c5a60e182a
  runtime_package_refs: "overrideable at Kflow submission with full commit SHAs"

output_patterns:
  - outputs/**

local_apps:
  - key: mfclshiny
    label: MFCL Shiny
    icon: chart-no-axes-combined
    runner: local-docker-ssh
    container_port: 3838
    memory: 8g
    archive_sources:
      - outputs
    env:
      MFCLSHINY_AUTO_LOAD: "true"
      MFCLSHINY_INITIAL_RENDER: "true"
      MFCLSHINY_LIVE_UPDATE: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: |
      Rscript - <<'RS'
      roots <- c(
        Sys.getenv("KFLOW_LOCAL_APP_OUTPUT_DIR", "/kflow/outputs"),
        Sys.getenv("KFLOW_LOCAL_APP_INPUT_DIR", "/kflow/inputs")
      )
      payloads <- unique(unlist(lapply(roots, function(root) {
        if (!dir.exists(root)) return(character())
        list.files(
          root,
          pattern = "^model_payload[.]rds$",
          recursive = TRUE,
          full.names = TRUE
        )
      }), use.names = FALSE))
      if (length(payloads) != 1L) {
        stop("Expected one final-exploration model payload; found ", length(payloads))
      }
      model_dir <- dirname(payloads[[1L]])
      package_archive <- file.path(model_dir, "runtime-package-library.tar.gz")
      version_file <- file.path(model_dir, "runtime-package-versions.csv")
      if (!file.exists(package_archive) || !file.exists(version_file)) {
        stop("The model output does not contain its pinned R package library.")
      }
      runtime_lib <- "/kflow/work/runtime-library"
      unlink(runtime_lib, recursive = TRUE, force = TRUE)
      dir.create(runtime_lib, recursive = TRUE, showWarnings = FALSE)
      utils::untar(package_archive, exdir = runtime_lib)
      .libPaths(unique(c(runtime_lib, .libPaths())))
      expected <- utils::read.csv(version_file, stringsAsFactors = FALSE)
      for (index in seq_len(nrow(expected))) {
        description <- utils::packageDescription(
          expected$package[[index]],
          lib.loc = runtime_lib
        )
        observed <- tolower(as.character(description[["RemoteSha"]][[1L]]))
        if (!identical(observed, tolower(expected$remote_sha[[index]]))) {
          stop("Local-app package SHA mismatch for ", expected$package[[index]])
        }
      }
      mfclshiny::run_mfclshiny(
        model_dir = model_dir,
        export_dir = "/kflow/work/export",
        host = "0.0.0.0",
        port = as.integer(Sys.getenv("PORT", "3838")),
        launch.browser = FALSE
      )
      RS

triggers: {}

job_config:
  optional:
    - MODEL
    - BET_PHASE10_11_CONVERGENCE
    - MFCLKIT_GITHUB_REF
    - MFCLSHINY_GITHUB_REF
    - KFLOW_REPO_RUNTIME_PACKAGES
    - KFLOW_REPO_RUNTIME_UPDATE
    - KFLOW_RUNTIME_REQUIRE_PRIVATE_PACKAGES
    - KFLOW_RUNTIME_GITHUB_AUTH
    - KFLOW_FORWARD_GITHUB_TOKEN_TO_RUNTIME
    - BUILD_MODEL_PAYLOAD
