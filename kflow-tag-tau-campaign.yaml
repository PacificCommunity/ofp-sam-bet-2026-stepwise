name: bet-2026-tag-tau-sc22-k015-20260725
description: Thirty native-MFCL full-fit sensitivities estimating tag-recapture dispersion under ten nested fishery groupings and tau lower bounds of 2, 3 and 4.

command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360

remote_host: suva
remote_user: kyuhank
