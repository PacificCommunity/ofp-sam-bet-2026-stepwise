name: Render BET 2026 stepwise report

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable TunaFlow 2.5 report runtime
        shell: bash
        run: |
          test "${MFCL_EXECUTABLE_VERSION}" = "v25-strict-tag-nb-dm-report"
          Rscript -e 'required <- c("ggplot2", "jsonlite", "patchwork", "ragg", "rmarkdown"); stopifnot(all(vapply(required, requireNamespace, logical(1), quietly = TRUE)))'
          pandoc --version | head -1

      - name: Validate and render
        run: ./run-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bet-2026-stepwise-report
          path: results/
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: results/stepwise-report

      - name: Build standalone report archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: zip -r "bet-2026-stepwise-report-${GITHUB_REF_NAME}.zip" results/stepwise-report data/stepwise data/SHA256SUMS run-report

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bet-2026-stepwise-report-${{ github.ref_name }}.zip

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
