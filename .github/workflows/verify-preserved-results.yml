name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install report-input test dependency
        shell: bash
        run: |
          curl --fail --location --retry 3 https://cran.r-project.org/src/contrib/jsonlite_2.0.0.tar.gz --output "$RUNNER_TEMP/jsonlite_2.0.0.tar.gz" ||
            curl --fail --location --retry 3 https://cran.r-project.org/src/contrib/Archive/jsonlite/jsonlite_2.0.0.tar.gz --output "$RUNNER_TEMP/jsonlite_2.0.0.tar.gz"
          printf '%s  %s\n' '75eb910c82b350ec33f094779da0f87bff154c232e4ae39c9896a9b89f3ac82d' "$RUNNER_TEMP/jsonlite_2.0.0.tar.gz" | sha256sum --check -
          Rscript -e 'install.packages(file.path(Sys.getenv("RUNNER_TEMP"), "jsonlite_2.0.0.tar.gz"), repos=NULL, type="source"); stopifnot(as.character(utils::packageVersion("jsonlite")) == "2.0.0")'
      - name: Check Make entry points without executing models
        run: python3 ci/check-make-entrypoints.py
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          sha256sum -c data/SHA256SUMS
          Rscript R/validate_stepwise_inputs.R
          Rscript R/validate_stepwise_payloads.R
          Rscript tests/test_stepwise_report_inputs.R
          python3 -m unittest discover -s tests -p "test_submit_stepwise_report.py"
          python3 ci/verify-preserved-files.py
          git diff --exit-code

  native:
    name: Regenerate saved stepwise fits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify preserved source and native archive
        run: |
          python3 ci/verify-preserved-files.py
          python3 reproduce/restore.py --verify
      - name: Regenerate native outputs and compare original results
        run: make rerun CASE=all OUT="$RUNNER_TEMP/bet-native"
      - name: Confirm source files are unchanged
        run: |
          python3 ci/verify-preserved-files.py
          git diff --exit-code
      - name: Retain numerical verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: saved-stepwise-native-checks
          path: |
            ${{ runner.temp }}/bet-native/native-checks.json
            ${{ runner.temp }}/bet-native/*/native-check.json
          if-no-files-found: error
          retention-days: 14
