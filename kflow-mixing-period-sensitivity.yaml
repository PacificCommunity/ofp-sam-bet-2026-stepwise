name: bet-2026-sc22-ip10-mixing-tagflag-grid-20260727
description: "Run 20 independent BET fits from the exact Job 16594 model: nine SC22-IP10 K mixing-period vectors and one all-2 vector, each paired with tag_flags(:,2) fixed to 1 or 0."

repo_full_name: PacificCommunity/ofp-sam-bet-2026-stepwise
branch: sensitivity/sc22-ip10-mixing-tagflag-grid-20260727
remote_host: suva
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput
slot_requirements: 'regexp("^suvofp", Machine)'

command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow@sha256:7b9dc95f535025a42109ac958c4faa3af96592cd19510ac0be15af4478eccf27

resources:
